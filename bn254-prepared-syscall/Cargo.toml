[package]
name = "solana-bn254-prepared-syscall"
description = "Solana alt_bn128 multi-pairing syscall with pre-prepared G2 points"
documentation = "https://docs.rs/solana-bn254-prepared-syscall"
version = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
edition = { workspace = true }

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[features]
agave-unstable-api = []

[dependencies]
ark-bn254 = { version = "0.5", default-features = false, features = ["curve"] }
ark-ec = { version = "0.5", default-features = false }
ark-ff = { version = "0.5", default-features = false }
ark-serialize = { version = "0.5", default-features = false }
bytemuck = { workspace = true, features = ["min_const_generics"] }
bytemuck_derive = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
ark-std = { version = "0.5", default-features = false }
criterion = { workspace = true }

[lints]
workspace = true
